# route_map.yaml
# 圖形式路線地圖 — 支援分叉路線
#
# 每個 node 對應一個 AprilTag pair。
# edges 定義兩個 node 之間的連通關係，以及哪個 pair_detector direction 代表「去程」。
# 路徑規劃用 BFS，回傳需要依序通過的 node 序列。
#
# pair: 兩個 tag ID（順序無關，系統自動比對）
# going_direction: pair_detector 輸出的 "going" 或 "returning"，
#                  表示從 from → to 方向時 pair_detector 應看到哪個值

# 實測路線：共用 tag 0 為左錨點，右邊 tag 1~4 標示 waypoint
# 起點 0_1 → 0_2 → 0_3 → 終點 0_4（在 0_4 前 1m 停車）

nodes:
  - id: "wp1"
    pair: [0, 1]
    name: "起點 0_1"

  - id: "wp2"
    pair: [0, 2]
    name: "途經 0_2"

  - id: "wp3"
    pair: [0, 3]
    name: "途經 0_3"

  - id: "wp4"
    pair: [0, 4]
    name: "終點 0_4"

edges:
  - from: "wp1"
    to: "wp2"
    going_direction: "going"

  - from: "wp2"
    to: "wp3"
    going_direction: "going"

  - from: "wp3"
    to: "wp4"
    going_direction: "going"
