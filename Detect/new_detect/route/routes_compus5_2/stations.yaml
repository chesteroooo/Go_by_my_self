# compus5.2 站點（aurora_map 座標 m）。座標會吸附到最近路徑點。
# 注意：回程（pass_08）走「南側斜路」另一條路回來，終點 C (15,-75) 離 A 還有 ~76 m
# —— 沒有開回 A，C 之後請遙控。pass_09~12 是原點附近不連通的碎段，規劃用不到。
snap_radius: 3.0
stations:
  A:  {x: -0.2,  y: 0.0}     # 起點（建圖原點，pass_00 起點）
  B:  {x: 350.8, y: -2.2}    # 最遠端折返點（pass_07 終點＝pass_08 起點）
  C:  {x: 15.1,  y: -74.6}   # 回程示教終點（pass_08 終點，南側斜路北端）
